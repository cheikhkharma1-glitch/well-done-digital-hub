# =====================================================================
# GitHub Actions — Build automatique + commit du dossier dist/
# Déclenché à chaque push sur main, hors commits de build (anti-boucle)
# Le commit généré sera ensuite récupéré par cPanel via "Update from Remote"
# =====================================================================

name: Build & Commit dist for cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # permet un déclenchement manuel depuis l'onglet Actions

# Permissions nécessaires pour pousser le commit du dist/
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Évite la boucle infinie : ignore les commits faits par le bot lui-même
    if: "!contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]'"

    steps:
      # 1. Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # token avec droits d'écriture pour pouvoir pousser
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Installer les dépendances
      - name: Install dependencies
        run: npm ci

      # 4. Build production avec variables d'environnement Supabase
      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      # 5. Copier le .htaccess dans dist/ (pour cPanel)
      - name: Copy .htaccess into dist
        run: |
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      # 6. Commiter et pousser le dossier dist/
      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Forcer l'ajout même si dist/ est dans .gitignore
          git add -f dist

          # Ne commit que si quelque chose a changé
          if git diff --staged --quiet; then
            echo "Aucun changement dans dist/, skip commit."
          else
            git commit -m "build: update dist [skip ci]"
            git push
          fi
